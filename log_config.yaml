version: 1
disable_existing_loggers: False

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] [%(name)s]: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  access:
    format: '%(asctime)s [%(levelname)s] %(client_addr)s - "%(request_line)s" %(status_code)s'
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  # The handler for uvicorn's own access logs
  uvicorn_access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
  
  # The handler for our Rich console output
  rich_console:
    class: rich.logging.RichHandler
    formatter: default
    level: DEBUG
    rich_tracebacks: True
    tracebacks_show_locals: True

  # The handler for our axiom.log file
  axiom_file:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: axiom.log
    maxBytes: 10485760 # 10MB
    backupCount: 3
    level: DEBUG

  # The handler for our web UI's live log stream
  queue_handler:
    class: axiom.scripts.studio_server.QueueLogHandler
    log_queue: !!python/name:axiom.scripts.studio_server.log_queue
    formatter: default
    level: DEBUG

loggers:
  # The logger for our application
  axiom:
    level: DEBUG
    handlers: [rich_console, axiom_file, queue_handler]
    propagate: no

  # The loggers for the web server
  uvicorn:
    level: INFO
    handlers: [rich_console]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [rich_console]
    propagate: no
  uvicorn.access:
    level: INFO
    handlers: [uvicorn_access]
    propagate: no