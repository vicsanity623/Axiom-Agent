<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0f0f11] text-gray-100">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clone Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="h-full flex flex-col p-6 select-none">

    <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center border border-gray-700">
            <i class="fab fa-github text-white text-xl"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold text-white">Clone Repository</h1>
            <p class="text-xs text-gray-500">Download a project from GitHub</p>
        </div>
    </div>

    <form id="clone-form" class="space-y-6 max-w-lg">

        <!-- Repo URL -->
        <div class="space-y-2">
            <label class="text-sm text-gray-300 font-medium">Repository URL</label>
            <input type="url" id="repo_url" name="repo_url" required placeholder="https://github.com/username/repo.git"
                class="w-full bg-[#18181b] border border-[#27272a] rounded p-2 text-sm text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <!-- Destination -->
        <div class="space-y-2">
            <label class="text-sm text-gray-300 font-medium">Destination Folder</label>
            <div class="flex gap-2">
                <input type="text" id="destination" name="destination" required placeholder="/path/to/folder"
                    class="flex-1 bg-[#18181b] border border-[#27272a] rounded p-2 text-sm text-white focus:border-indigo-500 focus:outline-none">
            </div>
            <p class="text-[10px] text-gray-500">The repository will be cloned into this directory.</p>
        </div>

        <div id="status-area"
            class="hidden p-3 rounded bg-[#18181b] border border-[#27272a] text-xs font-mono text-gray-400 whitespace-pre-wrap">
        </div>

        <div class="pt-4 flex gap-3">
            <button type="submit" id="clone-btn"
                class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                <span>Clone</span>
            </button>
            <button type="button" onclick="window.close()"
                class="px-4 bg-[#27272a] hover:bg-[#3f3f46] text-gray-300 py-2 rounded-lg text-sm font-medium transition-colors">
                Cancel
            </button>
        </div>

    </form>

    <script>
        document.getElementById('clone-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('clone-btn');
            const status = document.getElementById('status-area');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Cloning...';
            status.classList.remove('hidden');
            status.textContent = 'Starting git clone...';
            status.className = 'p-3 rounded bg-[#18181b] border border-[#27272a] text-xs font-mono text-gray-400 whitespace-pre-wrap';

            try {
                const res = await fetch('/api/clone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    status.textContent = result.message;
                    status.className = 'p-3 rounded bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-mono whitespace-pre-wrap';
                    btn.innerHTML = '<i class="fas fa-check"></i> Done';

                    // Offer to open
                    setTimeout(() => {
                        if (confirm('Clone successful! Open this folder?')) {
                            window.location.href = `axiom://open-recent?path=${encodeURIComponent(result.path)}`;
                        }
                    }, 500);
                } else {
                    throw new Error(result.detail || 'Clone failed');
                }
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-mono whitespace-pre-wrap';
                btn.disabled = false;
                btn.innerHTML = 'Clone';
            }
        });
    </script>

</body>

</html>
