<!DOCTYPE html>
<html>
<head>
    <title>Axiom Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0D1117; }
        #terminal { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-attach/lib/xterm-addon-attach.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script>
        const term = new Terminal({
            fontFamily: '"JetBrains Mono", "Menlo", monospace',
            fontSize: 14,
            cursorBlink: true,
            theme: { background: '#0D1117', foreground: '#C9D1D9' }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        
        const terminalContainer = document.getElementById('terminal');
        term.open(terminalContainer);

        const protocol = (location.protocol === 'https:') ? 'wss://' : 'ws://';
        const url = protocol + location.hostname + ':8765/terminal/ws';
        const socket = new WebSocket(url);

        const attachAddon = new AttachAddon.AttachAddon(socket);
        term.loadAddon(attachAddon);

        function sendResizeToBackend() {
            const dims = { rows: term.rows, cols: term.cols };
            const resizeMessage = JSON.stringify(['set_size', dims.rows, dims.cols]);
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(resizeMessage);
            }
        }

        function fitAndResize() {
            fitAddon.fit();
            sendResizeToBackend();
        }

        const resizeObserver = new ResizeObserver(entries => { fitAndResize(); });
        resizeObserver.observe(terminalContainer);
        
        fitAndResize();
        term.focus();

        // Make the terminal globally accessible for the Qt app to control
        window.axiom_terminal = term;
    </script>
</body>
</html>
