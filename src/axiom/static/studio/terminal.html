<!DOCTYPE html>
<html>

<head>
    <title>Axiom Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0D1117;
        }

        #terminal {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script>
        const term = new Terminal({
            fontFamily: '"JetBrains Mono", "Menlo", monospace',
            fontSize: 13,
            cursorBlink: true,
            theme: {
                background: '#0D1117',
                foreground: '#C9D1D9',
                cursor: '#58A6FF'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const terminalContainer = document.getElementById('terminal');
        term.open(terminalContainer);

        const protocol = (location.protocol === 'https:') ? 'wss://' : 'ws://';
        const url = protocol + location.hostname + ':8765/terminal/ws';
        const socket = new WebSocket(url);

        socket.onopen = () => {
            fitAndResize();
        };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg[0] === 'stdout') {
                term.write(msg[1]);
            } else if (msg[0] === 'setup') {
                // Initial setup message, ignore or handle
            }
        };

        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(['stdin', data]));
            }
        });

        function sendResizeToBackend() {
            const dims = { rows: term.rows, cols: term.cols };
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(['set_size', dims.rows, dims.cols]));
            }
        }

        function fitAndResize() {
            fitAddon.fit();
            sendResizeToBackend();
        }

        const resizeObserver = new ResizeObserver(entries => { fitAndResize(); });
        resizeObserver.observe(terminalContainer);

        window.addEventListener('resize', fitAndResize);

        // Expose function to send commands from Python
        window.sendToTerminal = function (text) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(['stdin', text]));
            }
        };

        // Focus terminal on click
        terminalContainer.addEventListener('click', () => term.focus());

        fitAndResize();
    </script>
</body>

</html>
